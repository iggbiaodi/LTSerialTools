import io.github.fvarrui.javapackager.gradle.PackageTask
import io.github.fvarrui.javapackager.model.HeaderType
import io.github.fvarrui.javapackager.model.WindowsExeCreationTool
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath 'io.github.fvarrui:javapackager:1.7.5'
    }
}

plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
}

apply plugin: 'io.github.fvarrui.javapackager.plugin'


group 'indi.lt.serialtool'
version '2.0.1'

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    junitVersion = '5.10.0'
    versions = [
            'jfx': '25.0.2'
    ]
}

def generatedResourcesDir = layout.buildDirectory.dir('generated/resources/main')

tasks.register('generateAppVersion') {
    def versionFile = generatedResourcesDir.map { it.file('app.properties') }
    outputs.file(versionFile)
    outputs.upToDateWhen { false }
    doLast {
        def outputFile = versionFile.get().asFile
        outputFile.parentFile.mkdirs()
        def buildTime = LocalDateTime.now().format(DateTimeFormatter.ofPattern('yyyy-MM-dd HH:mm:ss'))
        outputFile.setText("app.version=${project.version}\napp.build.time=${buildTime}\n", 'UTF-8')
    }
}

sourceSets {
    main {
        resources.srcDir(generatedResourcesDir)
    }
}

tasks.named('processResources') {
    dependsOn(tasks.named('generateAppVersion'))
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
    sourceCompatibility = JavaVersion.VERSION_23
    targetCompatibility = JavaVersion.VERSION_23
}


kotlin {
    jvmToolchain(23)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '23'
    }
}


application {
    mainClass = 'indi.lt.serialtool.Main'
    applicationDefaultJvmArgs = ["--enable-preview", "-Djavafx.enablePreview=true", "-Dprism.lcdtext=false",
                                 "-Dprism.text=t2k"]
}

javafx {
    version = "${versions.jfx}"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.swing']
}

def os = org.gradle.internal.os.OperatingSystem.current()
def arch = System.getProperty("os.arch")
def platform =
        os.isWindows() ? "win" :
                os.isMacOsX() ? (arch.contains("aarch64") || arch.contains("arm64") ? "mac-aarch64" : "mac") :
                        /* linux */ (arch.contains("aarch64") || arch.contains("arm64") ? "linux-aarch64" : "linux")
def appDisplayName = 'LTSerialTool'
def appExecutableName = "${appDisplayName}.exe"
def winFileVersionParts = project.version.toString()
        .split('-')[0]
        .tokenize('.')
        .collect { it.isInteger() ? Math.max(it.toInteger(), 0).toString() : '0' }
def winFileVersion = (winFileVersionParts + ['0', '0', '0', '0']).take(4).join('.')
def winIconFile = layout.projectDirectory.file('assets/windows/serial-tool.ico').asFile

dependencies {
    implementation('org.kordamp.ikonli:ikonli-javafx:12.3.1')
    implementation "org.kordamp.ikonli:ikonli-materialdesign2-pack:12.3.1"

    implementation 'io.github.nonoas:jfx-flat-ui:2.0.0-SNAPSHOT'
    implementation('com.fazecast:jSerialComm:2.10.4')
    implementation('org.apache.logging.log4j:log4j-core:2.20.0')
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'com.h2database:h2:2.2.220'
    implementation 'io.github.mkpaz:atlantafx-base:2.0.1'
    implementation "org.fxmisc.richtext:richtextfx:0.11.7"

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

test {
    useJUnitPlatform()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.register('packageMyApp', PackageTask) {
    dependsOn clean, jar
    displayName = appDisplayName
    appDescription = "${appDisplayName} desktop application"
    appName = appDisplayName
    organizationName = 'LTSerialTool Contributors'
    // mandatory
    mainClass = application.mainClass.get()
    // optional
    modules = ["java.base", "java.management", "java.net.http", "java.scripting", "java.sql",
               "java.naming",
               "jdk.jsobject", "jdk.unsupported", "jdk.unsupported.desktop", "jdk.xml.dom",
               // 这个模块没有的话，访问不了https
               "jdk.crypto.ec"
    ]
    vmArgs = [
            "-Djavafx.enablePreview=true",
            "-Dprism.lcdtext=false",
            "-Dprism.text=t2k",
            "--add-exports=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED"
    ]
    bundleJre = true
    generateInstaller = false
    // 是否需要管理员权限
    administratorRequired = false
    winConfig {
        createZipball = true
        headerType = HeaderType.gui
        exeCreationTool = WindowsExeCreationTool.winrun4j
        icoFile = winIconFile

        fileDescription = appDisplayName
        productName = appDisplayName
        internalName = appDisplayName
        originalFilename = appExecutableName
        companyName = 'LTSerialTool Contributors'

        fileVersion = winFileVersion
        productVersion = winFileVersion
        txtFileVersion = project.version.toString()
        txtProductVersion = project.version.toString()

        shortcutName = appDisplayName
    }

    doLast {
        def runnableJarName = "${appDisplayName}-${project.version}-runnable.jar"
        def packageDir = layout.buildDirectory.dir(appDisplayName).get().asFile
        def iniFile = new File(packageDir, "${appDisplayName}.ini")

        delete(new File(packageDir, runnableJarName))
        if (iniFile.exists()) {
            def iniLines = iniFile.readLines('UTF-8')
                    .findAll { it != "classpath.2=${runnableJarName}" }
            iniFile.setText(iniLines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        }
    }

}
